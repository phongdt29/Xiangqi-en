server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny everything else under a dot-directory except .well-known (needed
    # for ACME HTTP-01 challenges if ever used without the DNS/TLS-ALPN flow).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
