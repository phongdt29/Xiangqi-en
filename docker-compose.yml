# Production compose file for chinesechess.online.
#
# One-time setup on the VPS:
#   1. Point DNS A records for chinesechess.online, www.chinesechess.online,
#      api.chinesechess.online and ws.chinesechess.online at the VPS IP.
#   2. cp backend/.env.production.example backend/.env.production and fill
#      in real secrets (APP_KEY, DB password, REVERB_APP_KEY/SECRET/ID).
#   3. cp .env.example .env (repo root - just LETSENCRYPT_EMAIL + DB root pw).
#   4. docker compose up -d --build
#   5. docker compose exec backend php artisan migrate --force
#
# nginx-proxy + acme-companion auto-discover the other containers via their
# VIRTUAL_HOST/LETSENCRYPT_HOST labels and issue/renew Let's Encrypt certs -
# no manual certbot/nginx config needed on the host itself.
services:
  proxy:
    image: nginxproxy/nginx-proxy:1
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html

  acme:
    image: nginxproxy/acme-companion:2
    restart: unless-stopped
    depends_on:
      - proxy
    environment:
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL}
      NGINX_PROXY_CONTAINER: proxy
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-xiangqi}
      MYSQL_USER: ${DB_USERNAME:-xiangqi}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.production
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      VIRTUAL_HOST: api.chinesechess.online
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: api.chinesechess.online
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - backend_storage:/var/www/html/storage

  reverb:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file: ./backend/.env.production
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      VIRTUAL_HOST: ws.chinesechess.online
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ws.chinesechess.online
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://api.chinesechess.online
        NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY}
        NEXT_PUBLIC_REVERB_HOST: ws.chinesechess.online
        NEXT_PUBLIC_REVERB_PORT: "443"
        NEXT_PUBLIC_REVERB_SCHEME: https
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VIRTUAL_HOST: chinesechess.online,www.chinesechess.online
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: chinesechess.online,www.chinesechess.online
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}

volumes:
  certs:
  vhost:
  html:
  acme:
  mysql_data:
  backend_storage:
